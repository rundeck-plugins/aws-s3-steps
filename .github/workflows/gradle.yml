name: CI Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          
      - name: Fetch tags
        run: git fetch --tags --progress --no-recurse-submodules origin
        if: ${{ !contains(github.ref, 'refs/tags') }}
        
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'zulu'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-home-cache-cleanup: true
          
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        
      - name: Get release version
        id: get_version
        run: |
          VERSION=$(./gradlew currentVersion -q -Prelease.quiet)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: aws-s3-steps-${{ steps.get_version.outputs.VERSION }}
          path: build/libs/aws-s3-steps-${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 30