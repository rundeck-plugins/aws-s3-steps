name: CI Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - uses: rundeck-plugins/.github/.github/actions/setup-java@main
      - name: Fetch tags
        run: git fetch --tags --progress --no-recurse-submodules origin
        if: ${{ !contains(github.ref, 'refs/tags') }}
        
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-home-cache-cleanup: true
          
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        
      - name: Get release version
        id: get_version
        run: |
          VERSION=$(./gradlew currentVersion -q -Prelease.quiet)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Upload build artifacts
        uses: rundeck-plugins/.github/.github/actions/upload-artifact@main
        if: success()
        with:
          name: aws-s3-steps-${{ steps.get_version.outputs.VERSION }}
          path: build/libs/aws-s3-steps-${{ steps.get_version.outputs.VERSION }}.zip
          retention-days: 30